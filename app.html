<div class="app-window" id="TerminalApp">
  <div class="app-header">
    <span class="app-title">&gt;_ Terminal</span>
    <div class="app-controls"><button class="minimize-btn">–</button><button class="close-btn">×</button></div>
  </div>
  <div class="app-content">
    <div class="tm" id="tm-root">
      <div class="tm-out" id="tm-out"></div>
      <div class="tm-line"><span class="tm-prompt">myos&nbsp;$</span><input class="tm-in" id="tm-in" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></div>
    </div>
  </div>
  <div class="resize-handle"></div>
</div>
